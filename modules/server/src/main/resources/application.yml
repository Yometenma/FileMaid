spring:
  application:
    name: filemaid

server:
  port: ${FILEMAID_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

filemaid:
  db-path: ${FILEMAID_DB_PATH:./config/filemaid.db}
  roots:
    - id: media
      path: ${FILEMAID_MEDIA_ROOT:./data/media}
      writable: false
  scan:
    max-depth: ${FILEMAID_SCAN_MAX_DEPTH:16}
    max-files: ${FILEMAID_SCAN_MAX_FILES:10000}
  metadata:
    tmdb-api-key: ${FILEMAID_TMDB_API_KEY:}
    tvdb-api-key: ${FILEMAID_TVDB_API_KEY:}
    tvdb-pin: ${FILEMAID_TVDB_PIN:}
    omdb-api-key: ${FILEMAID_OMDB_API_KEY:}
    tvmaze-enabled: ${FILEMAID_TVMAZE_ENABLED:true}
    anidb-enabled: ${FILEMAID_ANIDB_ENABLED:true}
  naming:
    series: ${FILEMAID_NAMING_SERIES:}
    movie: ${FILEMAID_NAMING_MOVIE:}
    unknown: ${FILEMAID_NAMING_UNKNOWN:}
  probe:
    ffprobe-path: ${FILEMAID_FFPROBE_PATH:ffprobe}
