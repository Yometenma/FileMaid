plugins { id 'java-library' }

description = 'Existing FileMaid media organization engine, isolated from the self-hosted application.'

def legacyLibDir = providers.gradleProperty('filemaidLegacyLibDir')
        .orElse(providers.environmentVariable('FILEMAID_LEGACY_LIBS'))
        .orElse('D:/YomeXProjects/fb/deps')

dependencies {
    // Logging implementations are supplied by the host application. Keeping the
    // legacy JUL bridge here would make a Spring Boot server fail during startup.
    implementation fileTree(
            dir: legacyLibDir.get(),
            include: ['*.jar'],
            exclude: ['commons-logging.jar', 'slf4j-api.jar', 'slf4j-jdk14.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx2g']
    options.compilerArgs += ['-Xlint:-options', '-Xmaxerrs', '500']
}
