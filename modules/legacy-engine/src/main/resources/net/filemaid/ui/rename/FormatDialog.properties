episode.example[0]: {n} - {s00e00} - {t}{subt}
episode.example[1]: {n} - {sxe} - {t} {[vf, vc, ac]}
episode.example[2]: {n} [{airdate}] {t}
episode.example[3]: {ny}/{'Season '+s}/{n} - {s00e00} - {t}
episode.example[4]: {drive}/Media/{jellyfin.id}
episode.example[5]: {drive}/Media/{plex.id}

movie.example[0]: {n.colon(' - ')} ({y}){subt}
movie.example[1]: {n} ({y}, {director}) {vf} {hdr} {aco}
movie.example[2]: {n.space('.')}.{y}{'.'+source}{'.'+vf}
movie.example[3]: {genre}/{ny} {[certification, rating]}
movie.example[4]: {drive}/Media/{jellyfin.id}
movie.example[5]: {drive}/Media/{plex.id}

music.example[0]: {artist} - {t}
music.example[1]: {[y]} {artist} - {t}
music.example[2]: {n} - {t} {[khz]}
music.example[3]: {pi.pad(2)} {n} - {t} {[af, kbps]}
music.example[4]: {n}/{album+'/'}{pi.pad(2)+'. '} {t}
music.example[5]: {drive}/Media/{plex}

file.example[0]: {i.pad(3)} - {n.after('-')}
file.example[1]: {n.ascii().normalizePunctuation().space('_')}
file.example[2]: {n.clean().space(' ')}
file.example[3]: {media.Album} - {media.PartID} - {media.Title}
file.example[4]: {any{mediaTitle}{n}}
file.example[5]: {dt.format('yyyy-MM-dd HH\u2236mm\u2236ss')}
